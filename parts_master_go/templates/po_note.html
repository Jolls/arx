{{define "content"}}
<header>
    <h1>PO #{{.PO.Number}}</h1>
    <p>
        {{if .PO.SupplierID}}<a href="/supplier/{{derefInt .PO.SupplierID}}" style="color:white; text-decoration:underline;">{{.PO.SupplierName}}</a>
        {{else}}{{.PO.SupplierName}}{{end}}
    </p>
</header>
<div class="content">
    {{template "po_tabs" .}}

    {{if .PO.InternalNotes}}
    <div class="detail-section">
        <p style="white-space:pre-wrap; word-break:break-word; line-height:1.6;">{{.PO.InternalNotes}}</p>
    </div>
    {{else}}
    <p class="no-results">No internal note on this PO.</p>
    {{end}}
</div>
{{end}}
