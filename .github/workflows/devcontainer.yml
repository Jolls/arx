name: devcontainer

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'go.mod'
      - 'sqlc.yaml'
      - 'SQL/compose.yml'
      - 'SQL/compose_init.sh'
      - '.github/workflows/devcontainer.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'go.mod'
      - 'sqlc.yaml'
      - 'SQL/compose.yml'
      - 'SQL/compose_init.sh'
      - '.github/workflows/devcontainer.yml'

permissions:
  contents: read

jobs:
  build-in-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build dev image
        run: docker compose -f SQL/compose.yml -f .devcontainer/compose.yml build dev

      - name: go build inside the dev image
        run: docker compose -f SQL/compose.yml -f .devcontainer/compose.yml run --rm --no-deps dev go build ./...

      - name: Start the seeded DB
        run: docker compose -f SQL/compose.yml up -d --wait db

      - name: DB logs on failure
        if: failure()
        run: docker compose -f SQL/compose.yml logs db
