name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install systray cgo dependency
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Integration suite (-tags integration) against a seeded Postgres container (#19).
  # Required check: Postgres integration suite against postgres:17 (#32).
  postgres-integration:
    runs-on: ubuntu-latest
    env:
      ARX_TEST_DSN: postgres://postgres:postgres@localhost:5432/arxdev?sslmode=disable
    steps:
      # Plain docker run rather than a service container: the server needs ssl=on
      # (self-signed cert) because SettingsSave's reconnect builds its DSN with
      # sslmode=require, and service containers can't override the command.
      - name: Start Postgres (TLS)
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=arxdev postgres:17 \
            bash -c 'openssl req -new -x509 -days 1 -nodes -subj /CN=localhost -out /tmp/server.crt -keyout /tmp/server.key 2>/dev/null && chown postgres /tmp/server.* && chmod 600 /tmp/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key'
          for i in $(seq 30); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -d arxdev && exit 0; sleep 2; done; docker logs pg; exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install systray cgo dependency and psql
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev postgresql-client

      - name: Load schema, triggers, and seed data
        run: bash SQL/postgres/build_schema.sh | psql "$ARX_TEST_DSN" -q -v ON_ERROR_STOP=1

      - name: Integration test
        run: go test -tags integration ./arx_go/...
