# sqlc config (#190). Regenerate internal/dbq after editing a query file or the DDL:
#   sqlc generate
# CI runs `sqlc diff` and fails when the generated code is stale.
# schema: the reference DDL in build_schema.sh table order (the seed files aren't DDL, so the
# directory can't be listed as a whole). A query against a table missing here fails generation.
version: "2"
sql:
  - engine: postgresql
    schema:
      - SQL/uom.sql
      - SQL/contact.sql
      - SQL/company_attachment.sql
      - SQL/company.sql
      - SQL/part_category.sql
      - SQL/part.sql
      - SQL/mfg_part.sql
      - SQL/supplier_part.sql
      - SQL/price.sql
      - SQL/bom.sql
      - SQL/attachment_category.sql
      - SQL/part_attachment.sql
      - SQL/purchase_order.sql
      - SQL/po_line.sql
      - SQL/inventory_transaction.sql
      - SQL/build.sql
      - SQL/lot.sql
      - SQL/unit.sql
      - SQL/form.sql
      - SQL/form_row.sql
      - SQL/form_record.sql
      - SQL/result.sql
      - SQL/genealogy.sql
      - SQL/form_row_history.sql
      - SQL/form_events.sql
      - SQL/record_events.sql
      - SQL/record_event_results.sql
      - SQL/app_config.sql
      - SQL/named_queries.sql
      - SQL/users.sql
      - SQL/schema_migrations.sql
      - SQL/triggers.sql
    queries:
      - internal/contacts/contacts.sql
      - internal/parts/parts.sql
      - internal/attachments/attachments.sql
      - internal/purchasing/purchasing.sql
      - internal/inventory/inventory.sql
      - internal/reports/reports.sql
      - internal/appconfig/appconfig.sql
      - internal/auth/auth.sql
      - internal/settings/settings.sql
      - internal/records/records.sql
    gen:
      go:
        package: dbq
        out: internal/dbq
        omit_unused_structs: true
        # Match the Go models: int (not int32, so an oversized id errors in Postgres
        # instead of wrapping) and pointers for NULL instead of sql.Null*.
        overrides:
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type: { type: int, pointer: true }
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: date
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
          - db_type: pg_catalog.numeric
            go_type: { import: github.com/shopspring/decimal, type: Decimal }
          - db_type: pg_catalog.numeric
            nullable: true
            go_type: { import: github.com/shopspring/decimal, type: Decimal, pointer: true }
