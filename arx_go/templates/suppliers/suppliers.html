{{define "content"}}
<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="show-inactive">
            <label class="form-check-label" for="show-inactive">Show inactive</label>
        </div>
        <a href="/suppliers/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New Vendor</a>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/suppliers/rows">
            <colgroup>
                <col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th data-col="col-name">Vendor Name</th>
                    <th data-col="col-status">Status</th>
                    <th data-col="col-country">Country</th>
                    <th data-col="col-links"># Linked Parts</th>
                    <th data-col="col-pos"># POs</th>
                    <th data-col="col-contact">Default Contact</th>
                    <th data-col="col-stub" data-bs-toggle="tooltip" title="Short code used to name this supplier's attachment and PO folders">Folder Stub</th>
                </tr>
                <tr class="filter-row">
                    <th data-col="col-name"><input type="text" placeholder=""></th>
                    <th data-col="col-status"><input type="text" placeholder=""></th>
                    <th data-col="col-country"><input type="text" placeholder=""></th>
                    <th data-col="col-links"><input type="text" placeholder=""></th>
                    <th data-col="col-pos"><input type="text" placeholder=""></th>
                    <th data-col="col-contact"><input type="text" placeholder=""></th>
                    <th data-col="col-stub"><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top:15px; color:#666; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
