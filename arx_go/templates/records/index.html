{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Test Forms</h4>
  <a href="/forms/new" class="btn btn-sm btn-primary">
    <i class="bi bi-plus-circle"></i> New Form
  </a>
</div>

<table class="table table-bordered table-hover table-sm" data-paginate>
  <thead class="table-dark">
    <tr>
      <th class="sortable" onclick="sortTable(this)">Part Number</th>
      <th class="sortable" onclick="sortTable(this)">Title</th>
      <th class="text-center sortable" onclick="sortTable(this)">Rev</th>
      <th class="text-center">Status</th>
    </tr>
  </thead>
  <tbody>
    {{if not .Forms}}
    <tr><td colspan="4" class="text-center text-muted py-3">No active forms found</td></tr>
    {{end}}
    {{range .Forms}}
    <tr>
      <td>
        <a href="/forms/{{.ID}}/records" class="fw-semibold">{{.PartNumber}}</a>
      </td>
      <td>{{.Title}}</td>
      <td class="text-center">{{if .Revision}}Rev {{.Revision}}{{else}}Draft{{end}}</td>
      <td class="text-center">
        {{if .Locked}}
        <span class="badge bg-secondary"><i class="bi bi-lock-fill"></i> Locked</span>
        {{else}}
        <span class="badge bg-success">Active</span>
        {{end}}
      </td>
    </tr>
    {{end}}
  </tbody>
</table>
<div class="pagination-controls">
  <span class="pagination-info"></span>
  <div class="pagination-buttons">
    <button type="button" class="page-nav prev">&#8592; Previous</button>
    <button type="button" class="page-nav next">Next &#8594;</button>
  </div>
</div>
<p style="margin-top:15px; color:#666; text-align:right;">
  Total matching: <strong><span class="record-count">0</span></strong>
</p>
{{end}}
