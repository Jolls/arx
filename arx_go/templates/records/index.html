{{define "content"}}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h4 class="mb-0">Test Forms</h4>
  <a href="/forms/new" class="btn btn-sm btn-primary">
    <i class="bi bi-plus-circle"></i> New Form
  </a>
</div>

<div class="table-wrapper">
<table class="table table-bordered table-hover table-sm" data-rows-url="/api/forms/rows">
  <colgroup>
    <col><col><col><col>
  </colgroup>
  <thead>
    <tr class="table-dark">
      <th data-col="col-pn">Part Number</th>
      <th data-col="col-desc">Description {{template "filter_help_btn"}}</th>
      <th data-col="col-rev" class="text-center">Rev</th>
      <th data-col="col-status" class="text-center">Status</th>
    </tr>
    {{template "filter_row" (filterRow "forms")}}
  </thead>
  <tbody>
    <tr><td colspan="4" class="no-results">Loading&hellip;</td></tr>
  </tbody>
</table>
</div>
<nav aria-label="Pagination" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
  <span class="pagination-info text-body-secondary"></span>
  <ul class="pagination mb-0">
    <li class="page-item"><button type="button" class="page-link page-nav prev" onclick="prevPage()">&#8592; Previous</button></li>
    <li class="page-item"><button type="button" class="page-link page-nav next" onclick="nextPage()">Next &#8594;</button></li>
  </ul>
</nav>
<p class="text-body-secondary" style="margin-top:15px; text-align:right;">
  Total matching: <strong><span class="record-count">0</span></strong>
</p>
{{end}}
