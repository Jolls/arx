{{define "content"}}
<div class="content">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">What's New</h2>
    <a href="/settings" class="btn btn-sm btn-light">&#8592; Settings</a>
  </div>
  <div class="detail-section">
    <div style="white-space:pre-wrap; overflow-wrap:break-word; line-height:1.7; color:#333; font-size:0.95em;">{{.ReleaseNotes}}</div>
  </div>
</div>
<script>
if (typeof dismissWhatsNew === "function") { dismissWhatsNew("{{.AppVersion}}"); }
</script>
{{end}}
