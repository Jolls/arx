{{define "content"}}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Parts</a></li>
        <li class="breadcrumb-item active">{{if .IsNew}}New Part{{else}}{{.Part.PartNumber}}{{end}}</li>
    </ol>
</nav>
<div class="content">
    {{if not .IsNew}}
    {{template "part_tabs" .}}
    {{end}}

    {{if .Error}}<div class="alert alert-danger"><strong>Error:</strong> {{.Error}}</div>{{end}}

    <form method="post" action="{{if .IsNew}}/parts{{else}}/part/{{.Part.PNID}}{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="detail-section">
            <h3>Basic Information</h3>
            <div class="detail-row">
                <label for="part_number" class="form-label">Part Number *</label>
                <input type="text" id="part_number" name="part_number" class="form-control" required
                       value="{{.Part.PartNumber}}">
            </div>
            <div class="detail-row">
                <label for="revision" class="form-label">Revision</label>
                <input type="text" id="revision" name="revision" class="form-control"
                       value="{{.Part.Revision}}">
            </div>
            <div class="detail-row">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" class="form-control"
                       value="{{.Part.Title}}">
            </div>
            <div class="detail-row">
                <label for="detail" class="form-label">Detail</label>
                <input type="text" id="detail" name="detail" class="form-control"
                       value="{{.Part.Detail}}">
            </div>
            <div class="detail-row">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select">
                    {{range .Categories}}
                    <option value="{{.Code}}" {{if or (eq $.Part.Category .Code) (and (eq $.Part.Category "") (eq .Code "BUY"))}}selected{{end}}>{{.Code}} — {{.Label}}</option>
                    {{end}}
                </select>
            </div>
            <div class="detail-row">
                <label for="PNUNID" class="form-label">Unit of Measure</label>
                <select id="PNUNID" name="PNUNID" class="form-select">
                    <option value="">— None —</option>
                    {{range .Units}}
                    <option value="{{.ID}}" {{if and $.Part.UnitID (eq (derefInt $.Part.UnitID) .ID)}}selected{{end}}>
                        {{.Abbreviation}} — {{.DisplayName}}
                    </option>
                    {{end}}
                </select>
            </div>
            <div class="detail-row">
                <label for="current_cost" class="form-label" data-bs-toggle="tooltip"
                       title="Manually entered unit cost. For OPS (labor) parts this is the hourly rate; used as the rollup leaf cost when no preferred-supplier price exists.">Unit Cost / Rate</label>
                <input type="number" id="current_cost" name="current_cost" class="form-control" step="any" min="0"
                       value="{{if .Part.PNCurrentCost}}{{printf "%g" .Part.PNCurrentCost}}{{end}}">
            </div>
            <div class="detail-row">
                <label for="PNReqBy" class="form-label">Requested By</label>
                <input type="text" id="PNReqBy" name="PNReqBy" class="form-control"
                       value="{{.Part.PNReqBy}}">
            </div>
        </div>

        <div class="detail-section">
            <h3>Status</h3>
            <div class="detail-row">
                <label for="release_status" class="form-label">Status</label>
                <select id="release_status" name="release_status" class="form-select">
                    <option value=""{{if eq .Part.ReleaseStatus ""}} selected{{end}}>-- Select --</option>
                    <option value="U"{{if eq .Part.ReleaseStatus "U"}} selected{{end}}>Under Review</option>
                    <option value="A"{{if eq .Part.ReleaseStatus "A"}} selected{{end}}>Active</option>
                    <option value="D"{{if eq .Part.ReleaseStatus "D"}} selected{{end}}>Deprecated</option>
                </select>
            </div>
            <div class="detail-row">
                <label class="form-label">Active</label>
                <div class="form-checkbox-row">
                    <input type="checkbox" id="active" name="active" value="1"
                           {{if .Part.Active}}checked{{end}}>
                    <label for="active">Part is active</label>
                </div>
            </div>
            <div class="detail-row">
                <label class="form-label">Has BOM</label>
                <div class="form-checkbox-row">
                    <input type="checkbox" id="has_bom" name="has_bom" value="1"
                           {{if .Part.HasBOM}}checked{{end}}>
                    <label for="has_bom">Part has a Bill of Materials</label>
                </div>
            </div>
        </div>

        <div class="detail-section">
            <h3>Notes</h3>
            <textarea id="PNNotes" name="PNNotes" class="form-control" rows="4"
                      style="width:100%; margin-top:8px;">{{.Part.PNNotes}}</textarea>
        </div>

        <div class="detail-section">
            <h3>User Fields</h3>
            {{range .Part.UserFieldsForEdit}}
            <div class="detail-row">
                <label for="{{.Name}}" class="form-label">{{.Label}}</label>
                <input type="text" id="{{.Name}}" name="{{.Name}}" class="form-control"
                       value="{{.Value}}">
            </div>
            {{end}}
        </div>

<div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {{if .IsNew}}Create Part{{else}}Save Changes{{end}}
            </button>
            <a href="{{if .IsNew}}/{{else}}/part/{{.Part.PNID}}{{end}}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
