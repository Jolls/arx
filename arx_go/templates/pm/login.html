{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arx — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/pm/favicon.png">
    <link rel="stylesheet" href="/static/pm/app.css?v={{.AppVersion}}">
    <style>
        body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.10); padding: 40px 36px 32px; width: 360px; }
        .login-title { font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 6px; }
        .login-sub { font-size: 0.85em; color: #888; margin-bottom: 24px; }
    </style>
</head>
<body>
<div class="login-card">
    {{if .CompanyLogo}}<div style="text-align:center; margin-bottom:16px;"><img src="{{.CompanyLogo}}" alt="" style="max-height:64px;"></div>{{end}}
    <div class="login-title">Arx{{if .TestMode}} — TEST MODE{{end}}</div>
    <div class="login-sub">
        {{if .Bootstrap}}Create your admin account to get started.{{else}}Sign in to continue.{{end}}
    </div>

    {{if .Error}}
    <div class="alert alert-danger" role="alert">
        {{.Error}}
    </div>
    {{end}}

    <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        {{if .Bootstrap}}
        <div class="mb-3">
            <label class="form-label">Display Name</label>
            <input type="text" name="display_name" autofocus autocomplete="name" class="form-control">
        </div>
        {{end}}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" {{if not .Bootstrap}}autofocus{{end}} autocomplete="username"
                   value="{{.DefaultUsername}}" class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" autocomplete="{{if .Bootstrap}}new-password{{else}}current-password{{end}}" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">
            {{if .Bootstrap}}Create Account &amp; Sign In{{else}}Sign In{{end}}
        </button>
    </form>

    <div style="margin-top:20px; text-align:center; font-size:0.8em; color:#aaa;">
        <a href="/settings" style="color:#aaa;">Settings</a>
    </div>
</div>
</body>
</html>
{{end}}
