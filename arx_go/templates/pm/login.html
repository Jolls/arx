{{define "login.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arx — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/pm/favicon.png">
    <link rel="stylesheet" href="/static/pm/app.css?v={{.AppVersion}}">
    <style>
        body { background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.10); padding: 40px 36px 32px; width: 360px; }
        .login-title { font-size: 1.3em; font-weight: 600; color: #333; margin-bottom: 6px; }
        .login-sub { font-size: 0.85em; color: #888; margin-bottom: 24px; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-title">Arx{{if .TestMode}} — TEST MODE{{end}}</div>
    <div class="login-sub">
        {{if .Bootstrap}}Create your admin account to get started.{{else}}Sign in to continue.{{end}}
    </div>

    {{if .Error}}
    <div style="background:#f8d7da; border:1px solid #f5c2c7; border-radius:6px;
                padding:10px 14px; margin-bottom:16px; color:#842029; font-size:0.88em;">
        {{.Error}}
    </div>
    {{end}}

    <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        {{if .Bootstrap}}
        <div style="margin-bottom:14px;">
            <label style="display:block; font-size:0.85em; color:#555; margin-bottom:4px;">Display Name</label>
            <input type="text" name="display_name" autofocus autocomplete="name"
                   style="width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:4px; font-size:0.95em; box-sizing:border-box;">
        </div>
        {{end}}

        <div style="margin-bottom:14px;">
            <label style="display:block; font-size:0.85em; color:#555; margin-bottom:4px;">Username</label>
            <input type="text" name="username" {{if not .Bootstrap}}autofocus{{end}} autocomplete="username"
                   style="width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:4px; font-size:0.95em; box-sizing:border-box;">
        </div>

        <div style="margin-bottom:24px;">
            <label style="display:block; font-size:0.85em; color:#555; margin-bottom:4px;">Password</label>
            <input type="password" name="password" autocomplete="{{if .Bootstrap}}new-password{{else}}current-password{{end}}"
                   style="width:100%; padding:8px 10px; border:1px solid #ccc; border-radius:4px; font-size:0.95em; box-sizing:border-box;">
        </div>

        <button type="submit" class="btn-primary" style="width:100%; padding:10px; font-size:0.95em;">
            {{if .Bootstrap}}Create Account &amp; Sign In{{else}}Sign In{{end}}
        </button>
    </form>

    <div style="margin-top:20px; text-align:center; font-size:0.8em; color:#aaa;">
        <a href="/settings" style="color:#aaa;">Settings</a>
    </div>
</div>
</body>
</html>
{{end}}
