{{define "content"}}
<div class="content">
    <div class="d-flex justify-content-end mb-3">
        <a href="/pos/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New PO</a>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/pos/rows">
            <colgroup>
                <col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th>PO Number</th>
                    <th>Status</th>
                    <th>Vendor</th>
                    <th>Date Ordered</th>
                    <th>Date Closed</th>
                    <th><span data-bs-toggle="tooltip" title="Person who placed this purchase order">Orderer</span></th>
                    <th style="text-align:right;">Total Cost</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top:15px; color:#666; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
