{{define "content"}}
<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="show-rfqs">
            <label class="form-check-label" for="show-rfqs">Show RFQs</label>
        </div>
        <div class="d-flex gap-2">
            <a href="/pos/export.csv" class="btn btn-sm btn-outline-secondary"><i class="bi bi-download"></i> Export CSV</a>
            <a href="/rfqs/new" class="btn btn-sm btn-secondary"><i class="bi bi-plus-circle"></i> New RFQ</a>
            <a href="/pos/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New PO</a>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/pos/rows">
            <colgroup>
                <col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th>PO Number</th>
                    <th>Status</th>
                    <th>Vendor</th>
                    <th>Date Ordered</th>
                    <th>Date Closed</th>
                    <th><span data-bs-toggle="tooltip" title="Person who placed this purchase order">Orderer</span></th>
                    <th style="text-align:right;">Total Cost</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" placeholder=""></th>
                    <th>
                        <select class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="draft">Draft</option>
                            <option value="open">Open</option>
                            <option value="sent">Sent</option>
                            <option value="partially_received">Partially Received</option>
                            <option value="closed">Closed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top:15px; color:#666; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
