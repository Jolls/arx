{{define "content"}}
<div class="content">
    <div class="d-flex justify-content-end mb-3">
        <a href="/parts/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New Part</a>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/parts/rows">
            <colgroup>
                <col><col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th>Part Number</th>
                    <th><span data-bs-toggle="tooltip" title="Revision letter or number">Rev</span></th>
                    <th>Description</th>
                    <th><span data-bs-toggle="tooltip" title="Additional specification or value field">Detail</span></th>
                    <th><span data-bs-toggle="tooltip" title="Person who submitted this part number">Originator</span></th>
                    <th>Date</th>
                    <th><span data-bs-toggle="tooltip" title="Part category, e.g. Make, Buy, Assembly">Type</span></th>
                    <th>Last Modified</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="8" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top: 15px; color: #666; text-align: right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
