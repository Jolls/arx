{{define "content"}}
<header>
    <h1>Contacts</h1>
    <p>Contact list</p>
</header>
<div class="content">
    <a href="/contacts/new" class="new-record-btn">+ New Contact</a>

    <div class="table-wrapper">
        <table data-rows-url="/api/contacts/rows">
            <colgroup>
                <col><col><col><col><col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr>
                    <th>Associated Supplier</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Country</th>
                    <th>State</th>
                    <th>City</th>
                    <th>Phone</th>
                    <th>Web</th>
                    <th>Last Modified</th>
                    <th>Notes</th>
                    <th>Active</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="11" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top:15px; color:#666; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
