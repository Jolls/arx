{{define "content"}}
<header>
    <h1>Vendors</h1>
    <p>Vendor directory</p>
</header>
<div class="content">
    <a href="/suppliers/new" class="new-record-btn">+ New Vendor</a>

    <div class="table-wrapper">
        <table data-rows-url="/api/suppliers/rows">
            <thead>
                <tr>
                    <th>Vendor Name</th>
                    <th>Status</th>
                    <th>Country</th>
                    <th># Linked Parts</th>
                    <th># POs</th>
                    <th>Default Contact</th>
                    <th>Supplier Code</th>
                </tr>
                <tr class="filter-row">
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                    <th><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top:15px; color:#666; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
