{{define "content"}}
<header>
    <h1>{{if .IsNew}}Add Price{{else}}Edit Price{{end}}</h1>
    <p>{{.Part.PartNumber}}{{if .Part.Title}} &mdash; {{.Part.Title}}{{end}}</p>
</header>
<div class="content">
    {{template "part_tabs" .}}

    <div style="margin-bottom:20px;">
        <a href="/part/{{.Part.PNID}}/pricing" class="back-link" style="margin-bottom:0;">&#8592; Back to Pricing</a>
    </div>

    <form method="post" action="{{if .IsNew}}/part/{{.Part.PNID}}/pricing{{else}}/part/{{.Part.PNID}}/pricing/{{.Price.ID}}{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="detail-section">
            <div class="detail-row">
                <label for="supplier_id" class="form-label">Supplier *</label>
                <select id="supplier_id" name="supplier_id" class="form-select" required>
                    <option value="">-- Select --</option>
                    {{range .Suppliers}}
                    <option value="{{.ID}}"
                        {{if and $.Price.SupplierID (eq (derefInt $.Price.SupplierID) .ID)}}selected{{end}}>
                        {{.Name}}
                    </option>
                    {{end}}
                </select>
            </div>
            <div class="detail-row">
                <label for="pack_size" class="form-label">Pack Size *</label>
                <input type="number" id="pack_size" name="pack_size" class="form-input"
                       step="any" min="0" required value="{{fmtOptFloat .Price.PackSize}}">
            </div>
            <div class="detail-row">
                <label for="price_ea" class="form-label">Price / Unit</label>
                <input type="number" id="price_ea" name="price_ea" class="form-input"
                       step="any" min="0" value="{{fmtOptFloat .Price.PriceEA}}">
            </div>
            <div class="detail-row">
                <label for="price_pack" class="form-label">Price / Pack</label>
                <input type="number" id="price_pack" name="price_pack" class="form-input"
                       step="any" min="0" value="{{fmtOptFloat .Price.PricePack}}">
            </div>
            <div class="detail-row">
                <label for="effective_date" class="form-label">Effective Date</label>
                <input type="date" id="effective_date" name="effective_date" class="form-input"
                       value="{{formatDateInput .Price.EffectiveDate}}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">
                {{if .IsNew}}Add Price{{else}}Save{{end}}
            </button>
            <a href="/part/{{.Part.PNID}}/pricing" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{{end}}
