{{define "content"}}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/pos">POs</a></li>
        <li class="breadcrumb-item active">PO #{{.PO.Number}}</li>
    </ol>
</nav>
<div class="content">
    {{template "po_tabs" .}}

    {{if .PO.InternalNotes}}
    <div class="detail-section">
        <p style="white-space:pre-wrap; word-break:break-word; line-height:1.6;">{{.PO.InternalNotes}}</p>
    </div>
    {{else}}
    <p class="no-results">No internal note on this PO.</p>
    {{end}}
</div>
{{end}}
