{{define "content"}}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/parts">Parts</a></li>
        <li class="breadcrumb-item"><a href="/part/{{.Part.PNID}}/pricing">{{.Part.PartNumber}}</a></li>
        <li class="breadcrumb-item active">{{if .IsNew}}Add Price{{else}}Edit Price{{end}}</li>
    </ol>
</nav>
<div class="content">
    {{template "part_tabs" .}}

    <form id="price-form" method="post" action="{{if .IsNew}}/part/{{.Part.PNID}}/pricing{{else}}/part/{{.Part.PNID}}/pricing/{{.Price.ID}}{{end}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="detail-section">
            <div class="detail-row">
                <label for="supplier_name" class="form-label">Supplier *</label>
                <div style="position:relative; flex:1;">
                    <input type="text" id="supplier_name" class="form-control"
                           value="{{.Price.SupplierName}}" placeholder="Required — type to search…" autocomplete="off">
                    <input type="hidden" id="supplier_id" name="supplier_id"
                           value="{{if .Price.SupplierID}}{{derefInt .Price.SupplierID}}{{end}}">
                </div>
            </div>
            <div class="detail-row">
                <label for="pack_size" class="form-label">Pack Size *</label>
                <input type="number" id="pack_size" name="pack_size" class="form-control"
                       step="any" min="0" required value="{{fmtOptFloat .Price.PackSize}}">
            </div>
            <div class="detail-row">
                <label for="price_ea" class="form-label">Price / Unit</label>
                <input type="number" id="price_ea" name="price_ea" class="form-control"
                       step="any" min="0" value="{{fmtOptFloat .Price.PriceEA}}">
            </div>
            <div class="detail-row">
                <label for="price_pack" class="form-label">Price / Pack</label>
                <input type="number" id="price_pack" name="price_pack" class="form-control"
                       step="any" min="0" value="{{fmtOptFloat .Price.PricePack}}">
            </div>
            <div class="detail-row">
                <label for="effective_date" class="form-label">Effective Date</label>
                <input type="date" id="effective_date" name="effective_date" class="form-control"
                       value="{{formatDateInput .Price.EffectiveDate}}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {{if .IsNew}}Add Price{{else}}Save{{end}}
            </button>
            <a href="/part/{{.Part.PNID}}/pricing" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script src="/static/shared/supplier-typeahead.js?v={{.AppVersion}}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    setupSupplierTypeahead(
        document.getElementById('supplier_name'),
        document.getElementById('supplier_id')
    );
    const dateEl = document.getElementById('effective_date');
    if (!dateEl.value) {
        const d = new Date();
        dateEl.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    document.getElementById('price-form').addEventListener('submit', function(e) {
        const nameEl = document.getElementById('supplier_name');
        const idEl = document.getElementById('supplier_id');
        if (!idEl.value) {
            e.preventDefault();
            nameEl.classList.add('is-invalid');
            nameEl.focus();
        }
    });
});
</script>
{{end}}
