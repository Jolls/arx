{{define "content"}}
<div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/parts">Parts</a></li>
            <li class="breadcrumb-item"><a href="/part/{{.Part.ID}}/lots">{{.Part.PartNumber}} Lots</a></li>
            <li class="breadcrumb-item"><a href="/part/{{.Part.ID}}/lots/{{.Lot.ID}}">Lot {{.Lot.LotNumber}}</a></li>
            <li class="breadcrumb-item active">Edit</li>
        </ol>
    </nav>
    <a href="/part/{{.Part.ID}}/lots/{{.Lot.ID}}" class="btn btn-sm btn-outline-secondary">Cancel</a>
</div>
<div class="content">
    {{if .Error}}<div class="alert alert-danger"><strong>Error:</strong> {{.Error}}</div>{{end}}

    <form method="post" action="/part/{{.Part.ID}}/lots/{{.Lot.ID}}">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="detail-section">
            <h3>Lot {{.Lot.LotNumber}}</h3>
            <div class="detail-row">
                <label for="lot_description" class="form-label">Lot Description</label>
                <input type="text" id="lot_description" name="lot_description" class="form-control"
                       value="{{.Lot.LotDescription}}">
            </div>
            <div class="detail-row">
                <label for="vendor_lot" class="form-label">Vendor Lot</label>
                <input type="text" id="vendor_lot" name="vendor_lot" class="form-control"
                       value="{{.Lot.VendorLot}}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/part/{{.Part.ID}}/lots/{{.Lot.ID}}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{{end}}
