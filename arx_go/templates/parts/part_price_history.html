{{define "content"}}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/parts">Parts</a></li>
        <li class="breadcrumb-item active">{{.Part.PartNumber}}{{if .Part.Title}} &mdash; {{.Part.Title}}{{end}}</li>
    </ol>
</nav>
<div class="content">
    {{template "part_tabs" .}}

    {{if .HasData}}
    <div id="price-history-legend" class="d-flex flex-wrap align-items-center gap-3 mb-2"></div>
    <div id="price-history-chart" class="position-relative"></div>
    <script>window.PRICE_HISTORY = {{.PriceDataJSON}};</script>
    <script src="/static/parts/price_history.js?v={{.AppVersion}}"></script>
    {{else}}
    <div class="alert alert-info">
        No price history yet for this part. Unit costs from purchase orders and
        price-list entries will appear here over time.
    </div>
    {{end}}
</div>
{{end}}
