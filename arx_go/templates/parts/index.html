{{define "content"}}
<div class="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="show-inactive">
            <label class="form-check-label" for="show-inactive">Show inactive</label>
        </div>
        <div class="d-flex gap-2" data-col-table="parts-table">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Columns
                </button>
                <ul class="dropdown-menu dropdown-menu-end p-2" style="min-width:160px">
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-pn" checked> Part Number</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-rev" checked> Rev</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-title" checked> Description</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-detail" checked> Detail</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-reqby" checked> Originator</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-date" checked> Date</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-cat" checked> Type</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-modified" checked> Last Modified</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-attach" checked> Attachments</label></li>
                    <li><label class="dropdown-item d-flex gap-2 py-1"><input type="checkbox" data-toggle-col="col-polines" checked> PO Lines</label></li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li><a href="#" class="dropdown-item small text-muted" data-col-reset>Reset</a></li>
                </ul>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportCSV()"><i class="bi bi-download"></i> Export CSV</button>
            <a href="/lots" class="btn btn-sm btn-outline-secondary">All Lots</a>
            <button type="button" class="btn btn-sm btn-primary" onclick="openNewPartModal()"><i class="bi bi-plus-circle"></i> New Part</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" id="parts-table" data-rows-url="/api/parts/rows">
            <colgroup>
                <col><col><col><col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th data-col="col-pn">Part Number</th>
                    <th data-col="col-rev"><span data-bs-toggle="tooltip" title="Revision letter or number">Rev</span></th>
                    <th data-col="col-title">Description</th>
                    <th data-col="col-detail"><span data-bs-toggle="tooltip" title="Additional specification or value field">Detail</span></th>
                    <th data-col="col-reqby"><span data-bs-toggle="tooltip" title="Person who submitted this part number">Originator</span></th>
                    <th data-col="col-date">Date</th>
                    <th data-col="col-cat"><span data-bs-toggle="tooltip" title="Part category, e.g. Make, Buy, Assembly">Type</span></th>
                    <th data-col="col-modified">Last Modified</th>
                    <th data-col="col-attach" class="text-end" style="width:110px;">Attachments</th>
                    <th data-col="col-polines" class="text-end" style="width:90px;">PO Lines</th>
                </tr>
                <tr class="filter-row">
                    <th data-col="col-pn"><input type="text" placeholder=""></th>
                    <th data-col="col-rev"><input type="text" placeholder=""></th>
                    <th data-col="col-title"><input type="text" placeholder=""></th>
                    <th data-col="col-detail"><input type="text" placeholder=""></th>
                    <th data-col="col-reqby"><input type="text" placeholder=""></th>
                    <th data-col="col-date" data-filter-type="date"></th>
                    <th data-col="col-cat">
                        <select class="form-select form-select-sm">
                            <option value="">All</option>
                            {{template "part_category_options" (partCategoryCtx .Categories "")}}
                        </select>
                    </th>
                    <th data-col="col-modified" data-filter-type="date"></th>
                    <th data-col="col-attach"><input type="text" placeholder=""></th>
                    <th data-col="col-polines"><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="10" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-controls">
        <span class="pagination-info"></span>
        <div class="pagination-buttons">
            <button type="button" class="page-nav prev" onclick="prevPage()">&#8592; Previous</button>
            <button type="button" class="page-nav next" onclick="nextPage()">Next &#8594;</button>
        </div>
    </div>
    <p style="margin-top: 15px; color: #666; text-align: right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>

{{/* ── New part quick-add modal (#50) ─────────────────────────── */}}
<div class="modal fade" id="newPartModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Part</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="newPartNumber">Part Number</label>
          <input type="text" class="form-control" id="newPartNumber">
        </div>
        <div class="mb-3">
          <label class="form-label" for="newPartDescription">Description</label>
          <input type="text" class="form-control" id="newPartDescription">
        </div>
        <p class="text-muted small mb-0">Continue will proceed to the full New Part form.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="continueNewPart()">Continue</button>
      </div>
    </div>
  </div>
</div>
<script>
function openNewPartModal() {
  document.getElementById('newPartNumber').value = '';
  document.getElementById('newPartDescription').value = '';
  bootstrap.Modal.getOrCreateInstance(document.getElementById('newPartModal')).show();
}
function continueNewPart() {
  var pn = document.getElementById('newPartNumber').value.trim();
  var desc = document.getElementById('newPartDescription').value.trim();
  var url = '/parts/new';
  var params = [];
  if (pn) params.push('part_number=' + encodeURIComponent(pn));
  if (desc) params.push('description=' + encodeURIComponent(desc));
  if (params.length) url += '?' + params.join('&');
  window.location.href = url;
}
</script>
{{end}}
