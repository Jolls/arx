{{define "content"}}
<div class="content">
    <div class="d-flex flex-wrap justify-content-end align-items-center gap-2 mb-3">
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportCSV()"><i class="bi bi-download"></i> Export CSV</button>
            <a href="/pos/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New PO</a>
        </div>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/pos/rows">
            <colgroup>
                <col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th data-col="col-num">PO Number</th>
                    <th data-col="col-status">Status</th>
                    <th data-col="col-vendor">Vendor {{template "filter_help_btn"}}</th>
                    <th data-col="col-ordered">Date Ordered</th>
                    <th data-col="col-closed">Date Closed</th>
                    <th data-col="col-orderer"><span data-bs-toggle="tooltip" title="Person who placed this purchase order">Orderer</span></th>
                    <th data-col="col-cost" style="text-align:right;">Total Cost</th>
                </tr>
                <tr class="filter-row">
                    <th data-col="col-num"><input type="text" placeholder=""></th>
                    <th data-col="col-status">
                        <select class="form-select form-select-sm">
                            <option value="">All</option>
                            <option value="draft">Draft</option>
                            <option value="open">Open</option>
                            <option value="sent">Sent</option>
                            <option value="partially_received">Partially Received</option>
                            <option value="closed">Closed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </th>
                    <th data-col="col-vendor"><input type="text" placeholder=""></th>
                    <th data-col="col-ordered" data-filter-type="date"></th>
                    <th data-col="col-closed" data-filter-type="date"></th>
                    <th data-col="col-orderer"><input type="text" placeholder=""></th>
                    <th data-col="col-cost"><input type="text" placeholder=""></th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="7" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <nav aria-label="Pagination" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
        <span class="pagination-info text-body-secondary"></span>
        <ul class="pagination mb-0">
            <li class="page-item"><button type="button" class="page-link page-nav prev" onclick="prevPage()">&#8592; Previous</button></li>
            <li class="page-item"><button type="button" class="page-link page-nav next" onclick="nextPage()">Next &#8594;</button></li>
        </ul>
    </nav>
    <p class="text-body-secondary" style="margin-top:15px; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
