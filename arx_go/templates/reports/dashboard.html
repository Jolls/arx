{{define "content"}}
<div class="content">
    {{template "reports_tabs" .}}

    <div class="row row-cols-1 row-cols-md-2 g-3 mb-3">
        <div class="col">
            <div class="card h-100">
                <div class="card-header">Open POs</div>
                <div class="card-body">
                    <a href="/pos?f1=open" class="fs-1 fw-bold text-decoration-none">{{.OpenPOCount}}</a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card h-100">
                <div class="card-header">POs Received This Month</div>
                <div class="card-body">
                    <span class="fs-1 fw-bold">{{.POsReceivedThisMonth}}</span>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-cols-1 g-3">
        <div class="col">
            <div class="card h-100">
                <div class="card-header">Recent Activity</div>
                <div class="card-body">
                    {{if .RecentActivity}}
                    <table class="table table-sm table-hover mb-0">
                        <tbody>
                            {{range .RecentActivity}}
                            <tr>
                                <td class="text-muted" style="white-space:nowrap; width:100px;">{{.When}}</td>
                                <td><a href="{{.URL}}">{{.Label}}</a></td>
                                <td class="text-muted">{{.Detail}}</td>
                            </tr>
                            {{end}}
                        </tbody>
                    </table>
                    {{else}}
                    <p class="text-muted mb-0">No recent activity.</p>
                    {{end}}
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
