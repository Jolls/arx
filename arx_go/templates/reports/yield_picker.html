{{define "content"}}
<div class="content">
    {{template "reports_tabs" .}}

    <div class="card">
        <div class="card-header">Select a Form</div>
        <div class="card-body">
            {{if .Forms}}
            <table class="table table-sm table-hover mb-0">
                <thead><tr><th>Part Number</th><th>Description</th></tr></thead>
                <tbody>
                    {{range .Forms}}
                    <tr>
                        <td><a href="/forms/{{.ID}}/yield">{{.PartNumber}}</a></td>
                        <td>{{.Description}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
            {{else}}
            <p class="text-muted mb-0">No active forms found.</p>
            {{end}}
        </div>
    </div>
</div>
{{end}}
