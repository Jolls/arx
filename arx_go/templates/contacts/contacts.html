{{define "content"}}
<div class="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="show-inactive">
            <label class="form-check-label" for="show-inactive">Show inactive</label>
        </div>
        <a href="/contacts/new" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> New Contact</a>
    </div>

    <div class="table-wrapper">
        <table class="table table-bordered table-hover table-sm" data-rows-url="/api/contacts/rows">
            <colgroup>
                <col><col><col><col><col><col><col><col><col><col><col>
            </colgroup>
            <thead>
                <tr class="table-dark">
                    <th data-col="col-supplier">Associated Supplier {{template "filter_help_btn"}}</th>
                    <th data-col="col-name">Name</th>
                    <th data-col="col-email">Email</th>
                    <th data-col="col-country">Country</th>
                    <th data-col="col-state">State</th>
                    <th data-col="col-city">City</th>
                    <th data-col="col-phone">Phone</th>
                    <th data-col="col-web">Web</th>
                    <th data-col="col-modified">Last Modified</th>
                    <th data-col="col-notes">Notes</th>
                    <th data-col="col-active">Active</th>
                </tr>
                {{template "filter_row" (filterRow "contacts")}}
            </thead>
            <tbody>
                <tr><td colspan="11" class="no-results">Loading&hellip;</td></tr>
            </tbody>
        </table>
    </div>
    <nav aria-label="Pagination" class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
        <span class="pagination-info text-body-secondary"></span>
        <ul class="pagination mb-0">
            <li class="page-item"><button type="button" class="page-link page-nav prev" onclick="prevPage()">&#8592; Previous</button></li>
            <li class="page-item"><button type="button" class="page-link page-nav next" onclick="nextPage()">Next &#8594;</button></li>
        </ul>
    </nav>
    <p class="text-body-secondary" style="margin-top:15px; text-align:right;">
        Total matching: <strong><span class="record-count">0</span></strong>
    </p>
</div>
{{end}}
