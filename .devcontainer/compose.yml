# Adds the dev service next to the db service from SQL/compose.yml (#302).
# Paths are relative to SQL/ (the first compose file), not this directory.
services:
  dev:
    build:
      context: ../.devcontainer
    working_dir: /workspaces/arx
    command: sleep infinity
    # sleep as PID 1 ignores SIGTERM, so stopping waited 10s for SIGKILL.
    init: true
    volumes:
      - ..:/workspaces/arx:cached
    depends_on:
      db:
        condition: service_healthy
